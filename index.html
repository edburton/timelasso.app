<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timelasso</title>
<meta name="description" content="Catch any amount of time in a short timelapse. Coming soon to iPhone.">
<meta name="theme-color" content="#161a26">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; }

  /* A Timelasso clip of the City under cloud, looped with a one-second
     crossfade from its last second into its first. Towers fill the lower half,
     so the name sits in the sky above them and the words and the form on the
     streets below,
     each over a darkened band; the towers in between are left clear. The
     stills are each clip's first frame, shown while it loads and instead of it
     under reduced motion (no <source> matches then, so nothing downloads).
     The night gradient under them is only what shows if neither arrives. */
  body {
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(9vh, env(safe-area-inset-top) + 24px) 16px max(6vh, env(safe-area-inset-bottom) + 20px);
    color: #fff;
    background-color: #0b0820;
    background-image: url("sky-wide.jpg"), linear-gradient(172deg, #07061a 0%, #120b33 42%, #25124f 72%, #3a1450 100%);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }
  @media (orientation: portrait) {
    body { background-image: url("sky-tall.jpg"), linear-gradient(172deg, #07061a 0%, #120b33 42%, #25124f 72%, #3a1450 100%); }
  }

  .sky, body::after {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }
  .sky { object-fit: cover; }
  body::after {
    content: "";
    background: linear-gradient(to bottom,
      rgba(8, 10, 24, 0.55) 0%, rgba(8, 10, 24, 0) 40%,
      rgba(8, 10, 24, 0) 52%, rgba(8, 10, 24, 0.75) 100%);
  }

  header, footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  header { gap: 20px; }
  footer { gap: 32px; }

  .icon {
    width: min(38vw, 180px);
    aspect-ratio: 1;
    border-radius: 22.37%;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  }

  /* The logotype: Bpmf Huninn's outlines (OFL, see OFL.txt) with "sso" as
     one rope, drawn by design/logotype/make.py in the app's repo, which
     writes the app's watermark from the same outline. The em is the size the
     type was set at; the image is the font's line from ascender to
     descender, 0.97 of it. */
  h1 {
    margin: 0;
    font-size: min(10vw, 48px);
    line-height: 0;
  }
  h1 img {
    height: 0.97em;
    filter: drop-shadow(0 2px 18px rgba(0, 0, 0, 0.5));
  }
  /* The sign-up posts straight to Buttondown, which confirms by email and
     carries the unsubscribe link. A plain form with no script, so nothing
     loads from Buttondown until someone presses the button. */
  form {
    display: flex;
    gap: 8px;
    width: min(100%, 380px);
  }
  form, .note {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  input, button {
    font: inherit;
    border-radius: 12px;
    padding: 11px 14px;
    border: 1px solid rgba(255, 255, 255, 0.22);
  }
  input {
    flex: 1;
    min-width: 0;
    color: #fff;
    background: rgba(12, 14, 28, 0.45);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }
  input::placeholder { color: rgba(255, 255, 255, 0.5); }
  input:focus { outline: none; border-color: rgba(255, 214, 10, 0.8); }
  button {
    color: #1a0c05;
    background: #ffd60a;
    border-color: transparent;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #ffe04d; }
  /* Plain system type, so the wordmark stays the only Huninn on the page. */
  /* The footer is two groups: what the app does, then a wider gap, then the
     sign-up it leads to, headed by when. */
  .pitch, .soon {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
    text-wrap: balance;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
  }
  .pitch {
    width: min(100%, 380px);
    font-size: 17px;
    line-height: 1.45;
    color: rgba(255, 255, 255, 0.88);
  }
  .soon {
    font-size: 17px;
    font-weight: 600;
  }
  .signup {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }
  .note {
    margin: 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.75);
    text-align: center;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
  }
  .note a { color: inherit; }
</style>
</head>
<body>
  <video class="sky" autoplay muted loop playsinline aria-hidden="true">
    <source src="sky-tall.mp4" type="video/mp4" media="(prefers-reduced-motion: no-preference) and (orientation: portrait)">
    <source src="sky-wide.mp4" type="video/mp4" media="(prefers-reduced-motion: no-preference)">
  </video>
  <header>
    <img class="icon" src="icon-512.png" alt="Timelasso app icon">
    <h1><img src="wordmark.svg?v=287d0241" alt="timelasso.app"></h1>
  </header>
  <footer>
    <p class="pitch">Catch any amount of time in a short timelapse. Pick the clip length, then record for minutes, hours or days, and stop whenever you like.</p>
    <div class="signup">
      <p class="soon">Coming soon to iPhone</p>
      <form action="https://buttondown.com/api/emails/embed-subscribe/timelasso" method="post">
        <label for="email" hidden>Email address</label>
        <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <button type="submit">Keep me posted</button>
      </form>
      <p class="note">Launch news only. Unsubscribe any time. Or write to <a href="mailto:hello@timelasso.app">hello@timelasso.app</a>.</p>
    </div>
  </footer>
</body>
</html>
