<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timelasso</title>
<meta name="description" content="Timelasso — timelapse for iPhone.">
<meta name="theme-color" content="#0b0820">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Bpmf Huninn, the wordmark's face (OFL, see OFL.txt), cut down to the
     letters the page uses. Served from here rather than Google Fonts so the
     page makes no third-party requests. */
  @font-face {
    font-family: "Bpmf Huninn";
    src: url("huninn-wordmark.woff") format("woff");
    font-display: block;
  }

  html, body { margin: 0; height: 100%; }

  /* The night the icon's dusk turns into: the icon's top indigo taken down to
     near black overhead, and the amber of its horizon glow kept as a low,
     faint warmth, so the icon reads as a lit window onto the same sky. */
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    color: #fff;
    background-color: #0b0820;
    background-image:
      radial-gradient(ellipse 90% 38% at 64% 108%, rgba(229, 106, 0, 0.30), rgba(147, 38, 79, 0.16) 45%, transparent 75%),
      radial-gradient(ellipse 70% 50% at 20% 100%, rgba(43, 13, 84, 0.55), transparent 70%),
      linear-gradient(172deg, #07061a 0%, #120b33 42%, #25124f 72%, #3a1450 100%);
    background-attachment: fixed;
  }

  .icon {
    width: min(38vw, 180px);
    aspect-ratio: 1;
    border-radius: 22.37%;
    box-shadow: 0 18px 60px rgba(229, 106, 0, 0.18), 0 6px 24px rgba(0, 0, 0, 0.5);
  }

  h1 {
    margin: 0;
    font-family: "Bpmf Huninn", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: min(10vw, 48px);
    letter-spacing: 0.0125em;
    color: rgba(255, 255, 255, 0.92);
  }
  /* The sign-up posts straight to Buttondown, which confirms by email and
     carries the unsubscribe link. A plain form with no script, so nothing
     loads from Buttondown until someone presses the button. */
  form {
    display: flex;
    gap: 8px;
    width: min(100% - 32px, 380px);
    margin-top: 12px;
  }
  form, .note {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  input, button {
    font: inherit;
    border-radius: 12px;
    padding: 11px 14px;
    border: 1px solid rgba(255, 255, 255, 0.22);
  }
  input {
    flex: 1;
    min-width: 0;
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
  }
  input::placeholder { color: rgba(255, 255, 255, 0.45); }
  input:focus { outline: none; border-color: rgba(255, 214, 10, 0.8); }
  button {
    color: #1a0c05;
    background: #ffd60a;
    border-color: transparent;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #ffe04d; }
  .note {
    margin: -16px 0 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.55);
    text-align: center;
    padding: 0 16px;
  }
  .note a { color: inherit; }
</style>
</head>
<body>
  <img class="icon" src="icon-512.png" alt="Timelasso app icon">
  <h1>timelasso.app</h1>
  <form action="https://buttondown.com/api/emails/embed-subscribe/timelasso" method="post">
    <label for="email" hidden>Email address</label>
    <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
    <button type="submit">Keep me posted</button>
  </form>
  <p class="note">Launch news only. Unsubscribe any time. Or write to <a href="mailto:hello@timelasso.app">hello@timelasso.app</a>.</p>
</body>
</html>
